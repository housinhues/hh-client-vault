<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Mono','Courier New',monospace;background:#0a0a0a;color:#e8e4dc;min-height:100vh}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
input,textarea,select{font-family:inherit}
.tab-btn{background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:8px 14px;transition:all 0.15s;color:#555}
.tab-btn.active{color:#e8e4dc;border-bottom:1px solid #e8e4dc}
.tab-btn:hover:not(.active){color:#888}
.scope-row:hover{background:rgba(255,255,255,0.03)}
.step-item:hover .del-btn{opacity:1}
.del-btn{opacity:0;background:none;border:none;cursor:pointer;color:#ef4444;font-size:16px;transition:opacity 0.15s;padding:0 4px}
.pay-row:hover{background:rgba(255,255,255,0.02)}
.file-row:hover{background:rgba(255,255,255,0.02)}
.action-btn{background:#e8e4dc;color:#0a0a0a;border:none;padding:7px 16px;font-family:inherit;font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:opacity 0.15s}
.action-btn:hover{opacity:0.85}
.ghost-btn{background:none;border:1px solid #333;color:#888;padding:7px 16px;font-family:inherit;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 0.15s}
.ghost-btn:hover{border-color:#666;color:#ccc}
input[type=text],input[type=number],input[type=date],textarea,select{background:#111;border:1px solid #222;color:#e8e4dc;padding:7px 10px;font-size:12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:#444}
select option{background:#111}
.link-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.04);border:1px solid #222;color:#888;padding:4px 10px;font-size:11px;text-decoration:none;transition:all 0.15s;cursor:pointer}
.link-pill:hover{border-color:#555;color:#ccc}
</style>
</head>
<body>

    {task:"AI tools setup (ChatGPT Pro)",status:"pending",note:"R199, not yet delivered"},
    {task:"Social media strategy",status:"pending",note:"Discussed, never formalised"}
  ],
  flags:[

    {severity:"high",text:"Balance of R1200 still outstanding as of 21 May"},
    {severity:"medium",text:"Scope has tripled from original agreement — no formal written contract exists"},

const statusColors={done:"#22c55e","in-progress":"#f59e0b",pending:"#3b82f6","not-started":"#6b7280"};

function daysSince(dateStr){
  if(!dateStr)return null;
  const parts=dateStr.split(" ");
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  if(parts.length===3){
    const d=parseInt(parts[0]);
    const m=months.indexOf(parts[1]);
    const y=parseInt(parts[2]);
    if(m>=0){const diff=Date.now()-new Date(y,m,d).getTime();return Math.floor(diff/(1000*60*60*24));}
  }
  return null;
}

  },[]);

    const u={...d,lastUpdated:new Date().toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"})};
    setData(u);
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(u));setSaved(true);setTimeout(()=>setSaved(false),1500);}catch(e){}
  };

  const toggleScope=(i)=>{
    const s=["not-started","pending","in-progress","done"];
    const sc=[...data.scope];
    sc[i]={...sc[i],status:s[(s.indexOf(sc[i].status)+1)%s.length]};
    save({...data,scope:sc});
  };

  const addStep=()=>{if(!newStep.trim())return;save({...data,nextSteps:[...data.nextSteps,newStep.trim()]});setNewStep("");};
  const removeStep=(i)=>save({...data,nextSteps:data.nextSteps.filter((_,idx)=>idx!==i)});

  const addPay=()=>{
    if(!newPay.date||!newPay.amount)return;
    save({...data,financial:{...data.financial,payments:[...data.financial.payments,{...newPay,amount:parseFloat(newPay.amount)}]}});
    setNewPay({date:"",amount:"",method:"",note:""});setShowPayForm(false);
  };

  const addFile=()=>{
    if(!newFile.label||!newFile.url)return;
    save({...data,files:[...data.files,{...newFile}]});
    setNewFile({label:"",url:"",type:"doc"});setShowFileForm(false);
  };

  const removeFile=(i)=>save({...data,files:data.files.filter((_,idx)=>idx!==i)});

  const addTimeline=()=>{
    if(!newTimelineEntry.date||!newTimelineEntry.event)return;
    save({...data,timeline:[...data.timeline,{...newTimelineEntry}]});
    setNewTimelineEntry({date:"",event:""});setShowTimelineForm(false);
  };

  const logContact=()=>{
    if(!newContact.date)return;
    const entry={date:newContact.date,event:"Contact logged"+(newContact.note?" — "+newContact.note:"")};
    save({...data,client:{...data.client,lastContact:newContact.date},timeline:[...data.timeline,entry]});

  };

  const totalPaid=data.financial.payments.reduce((s,p)=>s+p.amount,0);
  const totalQuoted=data.financial.quoted+data.financial.registration;
  const balance=totalQuoted-totalPaid;
  const daysSinceContact=daysSince(data.client.lastContact);
  const tabs=["overview","scope","finance","files","flags","timeline"];
  const R=(tag,props,...children)=>React.createElement(tag,props,...children);

    R("span",{style:{color:"#555",minWidth:"80px",flexShrink:0}},k),
    R("span",{style:{color:"#ccc",wordBreak:"break-all",fontFamily:mono?"Syne,sans-serif":"inherit",letterSpacing:mono?"0.08em":"normal"}},v)
  );

  return R("div",{style:{fontFamily:"'DM Mono','Courier New',monospace",background:"#0a0a0a",minHeight:"100vh",color:"#e8e4dc"}},
    R("div",{style:{borderBottom:"1px solid #1a1a1a",padding:"24px 28px 0"}},

          R("div",{style:{fontSize:"10px",letterSpacing:"0.2em",textTransform:"uppercase",color:"#555",marginBottom:"5px"}},"Housing Hues · Client Brief"),

          )
        ),
        R("div",{style:{textAlign:"right",display:"flex",flexDirection:"column",gap:"6px",alignItems:"flex-end"}},
          R("div",{style:{background:balance>0?"rgba(239,68,68,0.1)":"rgba(34,197,94,0.1)",border:"1px solid "+(balance>0?"#ef4444":"#22c55e"),color:balance>0?"#ef4444":"#22c55e",padding:"4px 12px",fontSize:"11px",letterSpacing:"0.1em",textTransform:"uppercase"}},

            R("div",{style:{flex:1}},

            R("div",null,R("div",{style:{fontSize:"10px",color:"#444",marginBottom:"4px"}},"Note"),R("input",{type:"text",placeholder:"Optional",value:newPay.note,onChange:e=>setNewPay({...newPay,note:e.target.value})})),
            R("button",{className:"action-btn",onClick:addPay},"Add")
          ),
          data.financial.payments.map((p,i)=>
            R("div",{key:i,className:"pay-row",style:{display:"flex",alignItems:"center",gap:"14px",padding:"11px 18px",borderBottom:i<data.financial.payments.length-1?"1px solid #111":"none"}},

              R("span",{style:{fontFamily:"Syne,sans-serif",fontSize:"15px",fontWeight:"700",color:"#22c55e",minWidth:"65px"}},"R"+p.amount),
              R("span",{style:{fontSize:"11px",color:"#555",minWidth:"100px"}},p.method),
              R("span",{style:{fontSize:"11px",color:"#333"}},p.note)
            )
          )
        )
      ),
      tab==="files"&&R("div",{style:{display:"flex",flexDirection:"column",gap:"0",border:"1px solid #1a1a1a"}},
        R("div",{style:{padding:"12px 18px",borderBottom:"1px solid #1a1a1a",display:"flex",justifyContent:"space-between",alignItems:"center"}},
          R("div",{style:{fontSize:"10px",letterSpacing:"0.15em",color:"#555",textTransform:"uppercase"}},"Project Files"),
          R("button",{className:"ghost-btn",onClick:()=>setShowFileForm(!showFileForm)},"+ Add")
        ),
        showFileForm&&R("div",{style:{padding:"14px 18px",borderBottom:"1px solid #1a1a1a",display:"grid",gridTemplateColumns:"2fr 3fr 1fr auto",gap:"8px",alignItems:"end"}},
          R("div",null,R("div",{style:{fontSize:"10px",color:"#444",marginBottom:"4px"}},"Label"),R("input",{type:"text",placeholder:"File name",value:newFile.label,onChange:e=>setNewFile({...newFile,label:e.target.value})})),
          R("div",null,R("div",{style:{fontSize:"10px",color:"#444",marginBottom:"4px"}},"URL"),R("input",{type:"text",placeholder:"https://...",value:newFile.url,onChange:e=>setNewFile({...newFile,url:e.target.value})})),
          R("div",null,R("div",{style:{fontSize:"10px",color:"#444",marginBottom:"4px"}},"Type"),
            R("select",{value:newFile.type,onChange:e=>setNewFile({...newFile,type:e.target.value})},
              ["doc","site","chat","cipc","domain"].map(t=>R("option",{key:t,value:t},t))
            )
          ),
          R("button",{className:"action-btn",onClick:addFile},"Add")
        ),
        data.files.map((f,i)=>
          R("div",{key:i,className:"file-row",style:{display:"flex",alignItems:"center",gap:"14px",padding:"13px 18px",borderBottom:i<data.files.length-1?"1px solid #111":"none"}},
            R("span",{style:{fontSize:"10px",letterSpacing:"0.08em",textTransform:"uppercase",color:fileTypeColors[f.type]||"#6b7280",minWidth:"55px"}},f.type),
            R("span",{style:{fontSize:"12px",color:"#ccc",flex:1}},f.label),
            R("a",{href:f.url,target:"_blank",rel:"noopener",className:"link-pill"},"Open ↗"),
            R("button",{className:"del-btn",style:{opacity:1,fontSize:"14px"},onClick:()=>removeFile(i)},"×")
          )
        )
      ),
      tab==="flags"&&R("div",{style:{display:"flex",flexDirection:"column",gap:"8px"}},
        data.flags.map((f,i)=>
          R("div",{key:i,style:{border:"1px solid "+severityColors[f.severity]+"22",borderLeft:"3px solid "+severityColors[f.severity],padding:"13px 16px",display:"flex",gap:"14px",alignItems:"flex-start"}},
            R("span",{style:{fontSize:"10px",letterSpacing:"0.1em",textTransform:"uppercase",color:severityColors[f.severity],minWidth:"44px",marginTop:"1px"}},f.severity),
            R("span",{style:{fontSize:"12px",color:"#ccc",lineHeight:"1.6"}},f.text)
          )
        )
      ),
      tab==="timeline"&&R("div",null,
        R("div",{style:{display:"flex",justifyContent:"flex-end",marginBottom:"14px"}},
          R("button",{className:"ghost-btn",onClick:()=>setShowTimelineForm(!showTimelineForm)},"+ Add Entry")
        ),
        showTimelineForm&&R("div",{style:{background:"#0f0f0f",border:"1px solid #1a1a1a",padding:"14px 18px",marginBottom:"14px",display:"grid",gridTemplateColumns:"1fr 3fr auto",gap:"8px",alignItems:"end"}},
          R("div",null,R("div",{style:{fontSize:"10px",color:"#444",marginBottom:"4px"}},"Date"),R("input",{type:"text",placeholder:"24 Jun",value:newTimelineEntry.date,onChange:e=>setNewTimelineEntry({...newTimelineEntry,date:e.target.value})})),
          R("div",null,R("div",{style:{fontSize:"10px",color:"#444",marginBottom:"4px"}},"Event"),R("input",{type:"text",placeholder:"What happened?",value:newTimelineEntry.event,onChange:e=>setNewTimelineEntry({...newTimelineEntry,event:e.target.value})})),
          R("button",{className:"action-btn",onClick:addTimeline},"Add")
        ),
        R("div",{style:{position:"relative",paddingLeft:"22px"}},
          R("div",{style:{position:"absolute",left:"6px",top:0,bottom:0,width:"1px",background:"#1a1a1a"}}),
          data.timeline.map((item,i)=>
            R("div",{key:i,style:{position:"relative",marginBottom:"22px"}},
              R("div",{style:{position:"absolute",left:"-19px",top:"4px",width:"7px",height:"7px",borderRadius:"50%",background:i===data.timeline.length-1?"#e8e4dc":"#2a2a2a",border:"1px solid #444"}}),
              R("div",{style:{fontSize:"10px",color:"#444",letterSpacing:"0.1em",marginBottom:"3px"}},item.date),
              R("div",{style:{fontSize:"12px",color:"#ccc"}},item.event)
            )
          )
        )
      )
    )
  );
}
ReactDOM.render(React.createElement(App),document.getElementById("root"));
</script>
</body>
</html>
